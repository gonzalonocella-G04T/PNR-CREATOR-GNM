<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="32x32" href="fav/favicon-32.png"><link rel="icon" type="image/png" sizes="192x192" href="fav/icon-192.png"><link rel="apple-touch-icon" href="fav/apple-touch-icon.png"><meta name="theme-color" content="#043889">

<title>Tu Itinerario by Hiperviajes · Tabla</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>/* Concepto: una sola tabla con la identidad de Hiperviajes integrada (banda de marca arriba, filete turquesa, filas con logo, tránsito en verde). Pensada para pegarse en una cotización. */
:root {
  --bg: #F4F7F9;
  --surface: #FFFFFF;
  --surface-2: #E9F2F5;
  --ink: #1F3A4D;
  --ink-2: #5B7284;
  --line: #D3E2E9;
  --line-2: #B4CAD6;
  --blue: #1456F0;
  --blue-ink: #0B3FC2;
  --teal-d: #1A8FA6;
  --rule: #29B8CC;
  --amber-bg: #FFF1D3;
  --amber-ink: #7A4300;
  --green-bg: #DDF5EA;
  --shadow: 0 1px 2px rgba(11,37,64,.06), 0 8px 24px -12px rgba(11,37,64,.18);
  --f: Arial, 'Helvetica Neue', Helvetica, sans-serif;
  --f-mono: ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
button, input, textarea { font: inherit; color: inherit; }
h1, h2 { margin: 0; letter-spacing: 0; }
p { margin: 0; }
.mono { font-family: var(--f-mono); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }

.top { background: var(--surface); border-bottom: 3px solid #0A9BEA; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; justify-content: space-between; }
.ttl h1 { font-size: 20px; font-weight: 700; }
.ttl h1 b { color: var(--teal-d); letter-spacing: .02em; }
.ttl p { color: var(--ink-2); font-size: 13px; margin-top: 2px; }
.ttl { margin: 0; line-height: 0; }
.ttl img { display: block; height: 44px; width: auto; max-width: 100%; }
.tsub { color: var(--ink-2); font-size: 13px; }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 22px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.btn { display: inline-flex; align-items: center; justify-content: center; border: 1.5px solid transparent; border-radius: 12px; padding: 11px 18px; font-weight: 700; cursor: pointer; line-height: 1.1; min-height: 44px; }
.btn.sm { padding: 8px 12px; min-height: 38px; font-size: 13.5px; border-radius: 10px; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-ink); }
.btn-ghost { background: transparent; border-color: var(--line-2); }
.btn-ghost:hover { background: var(--surface-2); }
.row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
label { display: block; font-weight: 700; font-size: 13.5px; margin: 16px 0 6px; }
.opt { font-weight: 400; color: var(--ink-2); font-size: 12.5px; margin-left: 4px; }
textarea, input[type=text], input[type=number] { width: 100%; background: #fff; border: 1.5px solid var(--line-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
textarea { resize: vertical; }
#pnr { font-family: var(--f-mono); font-size: 12.5px; line-height: 1.5; white-space: pre; overflow: auto; }
textarea:focus, input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px rgba(20,86,240,.2); }
.sample-note { margin-top: 8px; font-size: 13px; color: var(--amber-ink); background: var(--amber-bg); border-radius: 8px; padding: 7px 10px; }
.sample-note[hidden] { display: none; }
.diag { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.dg { font-size: 13px; border-radius: 10px; padding: 8px 11px; }
.dg-ok { background: var(--green-bg); }
.dg-warn { background: var(--amber-bg); color: var(--amber-ink); }
.tzrow { display: flex; align-items: center; gap: 8px; margin: 8px 0 0; font-weight: 400; flex-wrap: wrap; }
.tzrow input { width: 96px; }
.opts { display: flex; flex-direction: column; gap: 4px; margin-top: 14px; border-top: 1px solid var(--line); padding-top: 8px; }
.chk { display: flex; align-items: center; gap: 8px; font-weight: 400; margin: 6px 0 0; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--blue); }

.app { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 880px) { .panel { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0 28px; } }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); min-width: 0; }
.panel h2 { font-size: 20px; }
.stage { min-width: 0; }
.copybar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.empty { background: var(--surface); border: 1.5px dashed var(--line-2); border-radius: 18px; padding: 40px 24px; text-align: center; }
.empty h2 { font-size: 22px; margin-bottom: 6px; }
.empty p { color: var(--ink-2); max-width: 42ch; margin: 0 auto; }

/* ---------- Tabla única (estilos en línea, aptos para mail) ---------- */
.tv { display: inline-block; max-width: 100%; overflow-x: auto; background: #fff; border: 1px solid #DCE7EF; border-radius: 10px; padding: 10px 12px; box-shadow: var(--shadow); vertical-align: top; }
.stage { overflow: hidden; }
#preview { overflow-x: auto; }

#toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 50; max-width: calc(100vw - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.copybar { display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-end; }
.cg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.cgl { width: 100%; font-size: 12px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .05em; }
.btn-wa { background: #1FA855; color: #fff; }
.btn-wa:hover { background: #178A45; }
.btn[disabled] { opacity: .6; cursor: progress; }
.cap { position: fixed; left: -12000px; top: 0; width: max-content; background: #fff; padding: 20px; }
.cap .tv { overflow: visible; box-shadow: none; border: 0; border-radius: 0; padding: 0; }
.btn-wa2 { background: #E3F6EA; color: #136C36; border-color: #A9DDBC; }
.btn-wa2:hover { background: #D2F0DD; }
.ov { position: fixed; inset: 0; background: rgba(10,25,45,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 60; }
.ovc { background: #fff; border-radius: 14px; max-width: min(1100px, 100%); max-height: 100%; overflow: auto; padding: 14px; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.ovh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 10px; }
.ovh span { color: var(--ink-2); font-size: 13.5px; flex: 1 1 260px; }
.ovc img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; }
.mailbox { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px; }
.mailbox[hidden] { display: none; }
.mrow { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-top: 6px; }
.mrow input[type=email] { flex: 1 1 280px; width: auto; background: #fff; border: 1.5px solid var(--line-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.mrow .chk { margin: 0; }
.btn-mail { background: #102E55; color: #fff; }
.btn-mail:hover { background: #0A1F3D; }
.mmsg { font-size: 13px; margin-top: 6px; color: var(--ink-2); min-height: 1em; }
.mmsg:empty { display: none; }
.mmsg.ok { color: #1F6B4B; }
.mmsg.err { color: #9A3A00; }
.mmsg a { color: var(--blue); font-weight: 700; }
.mconf { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 8px; background: #FFF6E0; border: 1px solid #F2D58C; border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
.mconf[hidden] { display: none; }
.mconf span { flex: 1 1 240px; }

.fmtbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 14px; }
.fmtbar .cgl { width: auto; }
.seg { display: inline-flex; border: 1px solid #CFDDE8; border-radius: 9px; overflow: hidden; background: #fff; }
.seg button { font: inherit; font-size: 13px; font-weight: 600; padding: 7px 14px; border: 0; border-left: 1px solid #CFDDE8; background: #fff; color: #102E55; cursor: pointer; }
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { background: #0B3A78; color: #fff; }
.seg button:focus-visible { outline: 2px solid #1E9BE0; outline-offset: -2px; }

.tv img { max-width: none; }
</style>
</head><body><div id="root"></div>

function copyImage(it, calc, btn) {
