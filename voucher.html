<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Voucher de servicios · Hiperviajes</title><link rel="icon" href="tv-fav/favicon.ico?v=2" sizes="any"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,500&family=Oswald:wght@500;600;700&display=swap"><style>:root{--navy:#174B4F;--sky:#148D7E;--sky2:#19C0AA;--ink:#1A474B;--line:#D9EEEC;--bg:#F3FBFA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink)}
.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h1{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:22px;letter-spacing:.5px;color:var(--navy)}
.top a{margin-left:auto;font-size:13px;color:#1B6368;text-decoration:none;font-weight:600}
.wrap{display:grid;grid-template-columns:minmax(300px,400px) 1fr;gap:20px;padding:20px;max-width:1280px;margin:0 auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start}
.panel label{display:block;font-size:12px;font-weight:600;margin:12px 0 4px;color:var(--navy)}
.panel label:first-child{margin-top:0}
.panel textarea,.panel select,.panel input[type=text]{width:100%;border:1px solid #C9ECE8;border-radius:8px;padding:8px;font:13px/1.4 ui-monospace,Menlo,monospace;background:#fff;color:var(--ink)}
.panel select,.panel input[type=text]{font-family:Inter,sans-serif}
.panel textarea{min-height:120px;resize:vertical}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
button{font:600 13px Inter,sans-serif;border-radius:8px;padding:9px 14px;border:1px solid var(--sky);cursor:pointer}
button.p{background:var(--sky);color:#fff}button.s{background:#fff;color:var(--sky)}
.seg{display:flex;border:1px solid var(--sky);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;background:#fff;color:var(--sky);flex:1}
.seg button.on{background:var(--sky);color:#fff}
.hint{font-size:12px;color:#465F5C;margin:6px 0 0}
.warns{margin:12px 0 0;padding:0;list-style:none}
.warns li{font-size:12px;background:#FFF6E0;border:1px solid #F0D79A;color:#6B4E00;border-radius:8px;padding:6px 9px;margin-top:6px}
.warns li.ok{background:#E9F8F4;border-color:#BFE8DF;color:#0B6B5C}
.stage{overflow:auto;padding-bottom:30px}
.sheet{width:210mm;min-height:297mm;background:#fff;margin:0 auto;box-shadow:0 2px 14px rgba(23,75,79,.18);position:relative;overflow:hidden;display:flex;flex-direction:column}
.sheet [contenteditable]{outline:none}
.sheet [contenteditable]:hover{background:rgba(25,192,170,.10)}
.sheet [contenteditable]:focus{background:rgba(25,192,170,.18)}
/* ---------- versión con fotos ---------- */
.v-foto .hd,.v-ink .hd{display:flex;align-items:center;justify-content:center;gap:7mm;padding:6mm 12mm 5mm}
.hd .lg,.hd .lg2{height:16mm;width:auto;max-width:56mm;object-fit:contain}
.hd .dv{width:.35mm;height:11mm;background:#b9d8d3;flex:none}
.v-foto .hero{position:relative;height:84mm;background:#9bd3cb center/cover no-repeat}
.v-foto .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,75,79,0) 42%,rgba(23,75,79,.78))}
.veil{position:absolute;left:0;right:0;top:0;height:46%;background:linear-gradient(180deg,#fff 0%,rgba(255,255,255,.92) 32%,rgba(255,255,255,.45) 68%,rgba(255,255,255,0) 100%);z-index:1}
.v-foto .logos{position:absolute;z-index:3;top:6mm;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:7mm}
.v-foto .logos .lg,.v-foto .logos .lg2{height:17mm;width:auto;max-width:56mm;object-fit:contain}
.v-foto .logos i{width:.35mm;height:11mm;background:#9fc9c3}
.v-foto .hero .tt{position:absolute;left:12mm;bottom:7mm;right:50mm;color:#fff;z-index:2}
.v-foto .hero .tt small{display:block;font:600 3.3mm Oswald,sans-serif;letter-spacing:.35em;opacity:.9}
.v-foto .hero .tt b{display:block;font:600 11mm/1.05 Oswald,sans-serif;text-transform:uppercase;margin-top:1mm}
.v-foto .hero .tt span{font:500 4.2mm Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase}
.v-foto .hero .st{position:absolute;right:10mm;bottom:5mm;height:34mm;z-index:2;transform:rotate(-6deg);filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.v-foto .body{padding:7mm 12mm 6mm;flex:1}
.pax{border:.3mm solid var(--line);background:var(--bg);border-radius:3mm;padding:3.5mm 5mm;margin-bottom:6mm;display:flex;gap:6mm;align-items:baseline}
.pax .k{font:600 3mm Oswald,sans-serif;letter-spacing:.2em;color:var(--sky);text-transform:uppercase}
.pax .v{font:600 4.4mm Inter,sans-serif}
.pax .n{margin-left:auto;font:500 3.6mm Inter,sans-serif;color:#465F5C;white-space:nowrap}
.sv{display:flex;gap:5mm;padding:4.5mm 0;border-top:.3mm solid var(--line);break-inside:avoid}
.sv:first-of-type{border-top:0}
.sv .dt{flex:0 0 22mm;text-align:center;background:var(--navy);color:#fff;border-radius:2.5mm;padding:2.5mm 0;align-self:flex-start}
.sv .dt b{display:block;font:600 9mm/1 Oswald,sans-serif}
.sv .dt i{display:block;font:500 3.4mm Oswald,sans-serif;letter-spacing:.2em;font-style:normal}
.sv .dt u{display:block;font:500 3mm Inter,sans-serif;text-decoration:none;opacity:.85}
.sv .tx{flex:1;min-width:0}
.sv .ti{font:600 5mm/1.2 Inter,sans-serif;color:var(--navy)}
.sv .rt{margin-top:1.5mm;font:400 4mm/1.35 Inter,sans-serif}
.sv .rt em{font-style:normal;color:var(--sky);font-weight:700;padding:0 1.5mm}
.sv .fl{margin-top:2mm;display:inline-flex;gap:2.5mm;align-items:center;font:600 3.5mm Inter,sans-serif;background:var(--bg);border:.3mm solid var(--line);border-radius:5mm;padding:1.2mm 3.5mm;color:var(--ink)}
.sv .fl i{font-style:normal;color:var(--sky)}
.obs{margin-top:4mm;font:400 3.6mm/1.4 Inter,sans-serif;border-left:1mm solid var(--sky2);padding:1mm 0 1mm 3mm;color:#33595c}
.obs:empty{display:none}
.ft{padding:4mm 12mm;background:var(--navy);color:#fff;display:flex;justify-content:space-between;font:500 3.2mm Inter,sans-serif;letter-spacing:.04em}
/* iconos y franja de foto en paseos */
.ic{width:1.15em;height:1.15em;flex:none}
.icw{display:inline-flex;vertical-align:-.2em;margin-right:.4em;color:var(--sky)}
.sv{position:relative}
.sv .strip{position:absolute;right:0;top:3mm;bottom:3mm;width:42mm;border-radius:0 2.5mm 2.5mm 0;overflow:hidden;z-index:0}
.sv .strip img{width:100%;height:100%;object-fit:cover;opacity:.8}
.sv .strip .fade{position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.85) 22%,rgba(255,255,255,.35) 55%,rgba(255,255,255,.05) 100%)}
.sv>.dt,.sv>.tx{position:relative;z-index:1}
.sv.exc .tx{padding-right:46mm}
.v-dig .r{position:relative}
.v-dig .r .strip{position:absolute;right:0;top:6px;bottom:6px;width:62%;background-size:cover;background-position:center;border-radius:12px;z-index:0}
.v-dig .r>.d,.v-dig .r>.x{position:relative;z-index:1}
.v-dig .r.exc .t{max-width:70%}
/* ---------- versión para imprimir (sin fotos; verdes oscuros que se leen bien en impresora B/N) ---------- */
.v-foto .hero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.v-ink{--g:#0A4F46;--g2:#0D6B5E;--tint:#E3F2EF}
.v-ink .hd{border-bottom:.8mm solid var(--g)}
.v-ink .hd .lg,.v-ink .hd .lg2{filter:contrast(1.25) saturate(1.2)}
.v-ink .hd .lg:first-child{filter:brightness(.55) saturate(1.6) contrast(1.2)}
.v-ink .band{position:relative;height:36mm;background:var(--tint);border-bottom:.8mm solid var(--g);border-left:3mm solid var(--g)}
.v-ink .band .tt{position:absolute;left:9mm;top:50%;transform:translateY(-50%);right:50mm}
.v-ink .band small{display:block;font:600 3.3mm Oswald,sans-serif;letter-spacing:.35em;color:var(--g2)}
.v-ink .band b{display:block;font:600 11mm/1.05 Oswald,sans-serif;text-transform:uppercase;color:var(--g);margin-top:1mm}
.v-ink .band span{font:600 4.2mm Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--g2)}
.v-ink .band .st{position:absolute;right:10mm;top:50%;height:30mm;transform:translateY(-50%) rotate(-6deg);filter:contrast(1.3) saturate(1.3)}
.v-ink .body{padding:7mm 12mm 6mm;flex:1}
.v-ink .pax{background:var(--tint);border:.5mm solid var(--g);border-radius:3mm}
.v-ink .pax .k{color:var(--g)}.v-ink .pax .v{color:#0b2f2a}.v-ink .pax .n{color:var(--g2)}
.v-ink .sv{border-top:.4mm solid var(--g2)}
.v-ink .sv:first-of-type{border-top:0}
.v-ink .sv .dt{background:var(--g);color:#fff;border-radius:2.5mm}
.v-ink .sv .ti{color:var(--g)}
.v-ink .icw{color:var(--g)}
.v-ink .sv .strip{display:none}
.v-ink .sv .rt em{color:var(--g)}
.v-ink .sv .fl{background:var(--tint);border:.4mm solid var(--g);border-radius:5mm;color:#0b2f2a}
.v-ink .sv .fl i{color:var(--g)}
.v-ink .obs{border-left:1mm solid var(--g);color:#0b2f2a}
.v-ink .ft{background:#fff;color:var(--g);border-top:.8mm solid var(--g);margin:0 12mm;padding:3mm 0;font-weight:600}
/* ---------- versión celular (9:16, para WhatsApp/correo) ---------- */
.v-dig{display:flex;flex-direction:column;width:540px;min-height:960px;border-radius:0;background:linear-gradient(180deg,#fff,#EAF7F4 55%,#fff);font-family:Inter,sans-serif;color:#0f3d3a}
.v-dig .hero{position:relative;height:330px;background:#8fd0e6}
.v-dig .hero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

.v-dig .logos{position:absolute;z-index:3;top:16px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:18px}
.v-dig .logos .lg,.v-dig .logos .lg2{height:44px;width:auto;max-width:150px;object-fit:contain}
.v-dig .logos i{width:1px;height:30px;background:#9fc9c3;flex:none}
.v-dig .hero .veil{height:48%}
.v-dig .wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:70px;z-index:2}
.v-dig .tit{text-align:center;padding:4px 20px 14px}
.v-dig .tit small{display:block;font:600 13px Oswald,sans-serif;letter-spacing:.45em;color:#0f6f64}
.v-dig .tit b{display:block;font:700 58px/1.05 Oswald,sans-serif;color:#0b4a49;letter-spacing:.01em;margin-top:4px}
.v-dig .tit span{display:block;font:600 15px Inter,sans-serif;letter-spacing:.5em;color:#17766a;margin-top:6px}
.v-dig .card{margin:6px 16px 14px;background:#fff;border:1px solid #cfe9e4;border-radius:18px;padding:6px 14px;box-shadow:0 6px 18px rgba(20,141,126,.10)}
.v-dig .r{display:flex;gap:14px;align-items:center;padding:14px 0;border-top:1px solid #dcefeb}
.v-dig .r:first-child{border-top:0}
.v-dig .d{flex:0 0 96px;text-align:center;color:#fff;background:linear-gradient(135deg,#27b49f,#0f8a79);border-radius:14px;padding:12px 4px}
.v-dig .d b{display:block;font:700 22px/1.1 Oswald,sans-serif}.v-dig .d i{display:block;font:500 15px Inter,sans-serif;font-style:normal;opacity:.95}
.v-dig .x{flex:1;min-width:0}
.v-dig .t{font:700 19px/1.2 Inter,sans-serif;color:#0b3d3a}
.v-dig .o{font:400 14px/1.35 Inter,sans-serif;margin-top:4px;color:#26524f}.v-dig .o em{font-style:normal;color:#0f8a79;font-weight:700}
.v-dig .fl{margin-top:8px;background:#e3f3ef;border-radius:10px;padding:6px 10px;font:500 13.5px Inter,sans-serif;color:#0b3d3a}
.v-dig .fl b{font-weight:700}
.v-dig .px{margin:0 16px 12px;background:#e3f3ef;border-radius:14px;padding:14px 18px;display:flex;gap:16px;align-items:center}
.v-dig .px span{font:600 12px Oswald,sans-serif;letter-spacing:.3em;color:#0f6f64}
.v-dig .px div{font:700 18px Inter,sans-serif}
.v-dig .ob{margin:0 16px 12px;font:400 14px/1.4 Inter,sans-serif;border-left:4px solid #19c0aa;padding-left:10px}
.v-dig .fo{margin-top:auto;padding:26px 0 22px;text-align:center;background:linear-gradient(180deg,#27b49f,#0f6f64);color:#fff;border-radius:60% 60% 0 0/26px 26px 0 0}
.v-dig .fo span{font:600 14px Oswald,sans-serif;letter-spacing:.4em}
.v-dig .fo small{display:block;font:400 10px Inter,sans-serif;opacity:.85;margin-top:6px;letter-spacing:.03em}
/* ---------- versión celular v2 (réplica del diseño de referencia) ---------- */
.v-dig2{width:610px;min-height:0;font-family:Montserrat,Inter,sans-serif;color:#12403d;background:linear-gradient(180deg,#f4fbfa 0,#eef8f6 60%,#e9f6f3 100%)}
.v-dig2 .hero{position:relative;height:250px;background:#bfe3ef;overflow:hidden}
.v-dig2 .hero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%}
.v-dig2 .veil{position:absolute;left:0;right:0;top:0;height:66%;background:linear-gradient(180deg,rgba(255,255,255,.97) 0%,rgba(255,255,255,.88) 42%,rgba(255,255,255,.35) 78%,rgba(255,255,255,0) 100%);z-index:1}
.v-dig2 .logos{position:absolute;z-index:2;top:10px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:22px}
.v-dig2 .logos .lg,.v-dig2 .logos-below .lg{height:82px;width:auto}
.v-dig2 .logos .lg2,.v-dig2 .logos-below .lg2{height:64px;width:auto;max-width:210px;object-fit:contain}
.v-dig2 .logos i,.v-dig2 .logos-below i{width:1px;height:56px;background:#8fc6bd}
.v-dig2 .logos-below{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:24px;margin:-8px 0 12px}
.v-dig2 .wave{position:absolute;left:0;right:0;bottom:-1px;width:100%;height:52px;z-index:2}
.v-dig2 .mid{position:relative;padding:0 0 12px}
.v-dig2 .deco{position:absolute;left:0;top:-10px;width:100%;height:300px;z-index:0}
.v-dig2 .tit,.v-dig2 .card,.v-dig2 .px,.v-dig2 .ob{position:relative;z-index:1}
.v-dig2 .tit{text-align:center;padding:0 24px 14px}
.v-dig2 .kick{display:flex;align-items:center;justify-content:center;gap:14px;font:600 11px Montserrat,sans-serif;letter-spacing:.42em;color:#1d3f3c}
.v-dig2 .kick i{width:46px;height:1px;background:#2a8f83}
.v-dig2 .tit b{display:block;font:800 49px/1.04 Montserrat,sans-serif;color:#0e3d3b;letter-spacing:-.005em;margin-top:6px}
.v-dig2 .ctry{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:6px;font:600 12px Montserrat,sans-serif;letter-spacing:.55em;color:#12403d}
.v-dig2 .pin{width:15px;height:15px;color:#1f8f82}
.v-dig2 .card{margin:0 24px;background:rgba(255,255,255,.82);border:1px solid #cfe7e2;border-radius:12px;padding:2px 14px}
.v-dig2 .r{position:relative;display:flex;align-items:center;padding:12px 0;border-top:1px solid #dcecea}
.v-dig2 .r:first-child{border-top:0}
.v-dig2 .chip{position:relative;z-index:1;flex:0 0 112px;height:62px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:9px;box-shadow:0 2px 6px rgba(20,110,100,.12)}

.v-dig2 .chip span{display:block;font:500 15px/1.15 Montserrat,sans-serif}
.v-dig2 .vl{position:relative;z-index:1;flex:none;width:1px;height:54px;background:#cfe3df;margin:0 14px}
.v-dig2 .bd{position:relative;z-index:1;flex:1;min-width:0}
.v-dig2 .tp{display:flex;align-items:flex-start;gap:12px}
.v-dig2 .ico{flex:none;width:28px;height:28px;color:#1f8f82;margin-top:1px}
.v-dig2 .t{font:800 15.5px/1.2 Montserrat,sans-serif;color:#12403d}
.v-dig2 .o{font:500 11.5px/1.4 Montserrat,sans-serif;color:#2b4f4c;margin-top:3px;display:flex;gap:14px;align-items:center}
.v-dig2 .o em{font-style:normal;font-weight:700;color:#12403d}
.v-dig2 .sub{font:italic 500 10.5px/1.35 Montserrat,sans-serif;color:#2b4f4c;margin-top:3px}
.v-dig2 .fl{margin-top:7px;display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,#e6f1ef,#eef6f5);border-radius:8px;padding:5px 12px;font:500 11.5px Montserrat,sans-serif;color:#12403d}

.v-dig2 .fl b{font-weight:700}
.v-dig2 .pl{width:14px;height:14px;color:#12403d}
.v-dig2 .r.exc .bd{padding-right:142px}
.v-dig2 .strip{position:absolute;right:-8px;top:6px;bottom:6px;width:150px;border-radius:0 8px 8px 0;overflow:hidden;z-index:0}
.v-dig2 .strip img{width:100%;height:100%;object-fit:cover;object-position:center;opacity:.8}
.v-dig2 .strip .fade{position:absolute;inset:0;background:linear-gradient(90deg,#fff 0%,rgba(255,255,255,.85) 22%,rgba(255,255,255,.35) 55%,rgba(255,255,255,.05) 100%)}
.v-dig2 .px{margin:12px 24px 0;background:linear-gradient(90deg,#e4f2ef,#ecf6f4);border-radius:12px;padding:12px 18px;display:flex;align-items:center;justify-content:center;gap:14px}

.v-dig2 .nm{font:800 16px Montserrat,sans-serif;color:#0e3d3b}

.v-dig2 .ob{margin:10px 24px 0;font:500 11.5px/1.45 Montserrat,sans-serif;border-left:3px solid #2aa192;padding-left:10px}

</style></head><body><header class="top"><h1>Voucher de servicios</h1><span class="hint" style="margin:0">Traslados y excursiones + vuelos → voucher listo para el pasajero</span><a href="index.html">← Volver a Tu Itinerario</a></header>
<div class="wrap"><aside class="panel">

<textarea id="serv" placeholder="Traslado regular in + out El Calafate&#10;Nombre Apellido x2&#10;Llegada: Aeropuerto … - Hotel …  dd/mm/aaaa&#10;Salida: Hotel … - Aeropuerto …  dd/mm/aaaa&#10;&#10;Excursión … dd/mm/aaaa"></textarea>

<p class="hint">Los logos viven en la carpeta <b>operadores/</b>. Si no está, subí uno suelto:</p>

var SMALL={de:1,del:1,la:1,las:1,los:1,el:1,al:1,y:1,en:1,a:1,e:1,con:1,por:1,para:1,'+':1};
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase().replace(/\s+/g,' ').trim();}
function titleCase(s){
  return String(s).toLowerCase().replace(/\s+/g,' ').trim().split(' ').map(function(w,i){
    if(i>0&&SMALL[w])return w;
    return w.replace(/(^|[-\/(])([a-záéíóúñü])/g,function(m,p,c){return p+c.toUpperCase();});

}

var GLOSARIO=[

function aplicarGlosario(t){

/* ---- Solicitud de servicios ---- */
function parseServicios(txt){
  var warns=[],lines=txt.split(/\r?\n/).map(function(l){return l.trim();}).filter(Boolean);
  var dest=destinoPorTexto(txt),svs=[],paxTxt=null,paxN=null,kind='regular',hdrDest=null;
  var anio=null;(txt.match(/\d{1,2}\/\d{1,2}\/(\d{2,4})/)||[])[1]&&(anio=+RegExp.$1);if(anio&&anio<100)anio+=2000;
  lines.forEach(function(l){
    var low=norm(l);
    var mp=l.match(/^(.+?)\s*[xX]\s*(\d+)\s*$/);
    if(mp&&!/\d\/\d/.test(l)){paxTxt=titleCase(mp[1]);paxN=+mp[2];return;}
    var ml=l.match(/^(llegada|salida|in|out|ida|regreso)\s*:\s*(.+)$/i);
    if(ml){
      var f=fechaDe(ml[2],anio),cuerpo=ml[2].replace(/\s*\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\s*$/,'').trim();
      var partes=cuerpo.split(/\s+[-–>→]+\s+/);
      if(partes.length<2){warns.push('No pude separar origen y destino en: "'+l+'"');return;}
      var esIn=/^(llegada|in|ida)/i.test(ml[1]);
      svs.push({tipo:esIn?'in':'out',kind:kind,from:partes[0],to:partes.slice(1).join(' - '),f:f,raw:l});
      if(!f)warns.push('Servicio sin fecha: "'+l+'"');
      return;
    }
    if(/^traslado/i.test(low)){
      kind=/PRIVAD/.test(low)?'privado':(/REGULAR|COMPARTID/.test(low)?'regular':'');
      var d=destinoPorTexto(l);if(d)hdrDest=d;
      var f2=fechaDe(l,anio);
      if(f2){ // traslado suelto con fecha en la misma línea
        var cu=l.replace(/\s*\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\s*$/,'');
        var pp=cu.split(/\s+[-–>→]+\s+/);
        if(pp.length>=2){var esAero=/aeropuerto/i.test(pp[0].replace(/^traslado\s+\w*\s*/i,''));
          svs.push({tipo:esAero?'in':'out',kind:kind,from:pp[0].replace(/^traslado\s+(regular|privado)?\s*/i,''),to:pp.slice(1).join(' - '),f:f2,raw:l});}
      }
      return;
    }
    if(/^(excursi|tour|paseo|entrada|city tour|visita|full day|half day)/i.test(low)){
      var f3=fechaDe(l,anio),t=l.replace(/\s*\d{1,2}\/\d{1,2}(?:\/\d{2,4})?\s*$/,'').trim();
      svs.push({tipo:'exc',titulo:aplicarGlosario(titleCase(t)),f:f3,raw:l});
      if(!f3)warns.push('Excursión sin fecha: "'+l+'"');
      return;
    }
  });
  if(!dest&&hdrDest)dest=hdrDest;
  return {dest:dest,svs:svs,paxTxt:paxTxt,paxN:paxN,warns:warns,anio:anio};
}

function lugar(t,dest){
  var s=t.trim();
  if(/^aeropuerto\b/i.test(s)){
    var resto=s.replace(/^aeropuerto\s*/i,'');
    var d=destinoPorTexto(resto)||dest;
    if(d&&norm(resto)===norm(d.n)||(d&&d.a.some(function(a){return norm(a)===norm(resto);})))return 'Aeropuerto '+nombreDestino(d);
    return 'Aeropuerto '+titleCase(resto);
  }
  return titleCase(s);
}

/* ---- Armado del voucher ---- */
function armarVoucher(txtServ,txtVuelos){
  var S=parseServicios(txtServ),V=parseVuelos(txtVuelos||''),warns=S.warns.concat(V.warns),dest=S.dest;
  if(!dest)warns.push('No reconocí el destino: elegilo manualmente o revisá el texto.');
  var codes=dest?dest.c:[];
  var items=[];
  S.svs.forEach(function(s){
    var it={f:s.f,tipo:s.tipo};
    if(s.tipo==='exc'){it.titulo=s.titulo;items.push(it);return;}
    var k=s.kind==='privado'?'Privado':(s.kind==='regular'?'Regular':'');
    it.titulo=('Traslado '+k).trim()+' – '+(s.tipo==='in'?'IN':'OUT');
    it.from=lugar(s.from,dest);it.to=lugar(s.to,dest);
    // vuelo asociado
    if(s.f&&V.vuelos.length){
      var cand=V.vuelos.filter(function(v){
        if(s.tipo==='in'){var dd=v.arrD||v.d,mm=v.arrM||v.m;return dd===s.f.d&&mm===s.f.m&&codes.indexOf(v.to)>=0;}
        return v.d===s.f.d&&v.m===s.f.m&&codes.indexOf(v.from)>=0;
      });
      if(cand.length===1){var v=cand[0];it.vuelo={n:v.aero+v.num,from:v.from,to:v.to,dep:v.dep,arr:v.arr,sig:!!(v.arrD&&v.arrD!==v.d)};}
      else if(cand.length>1)warns.push('Más de un vuelo coincide con el '+s.f.d+'/'+s.f.m+' ('+s.tipo.toUpperCase()+'): revisá a mano.');
      else warns.push('No encontré vuelo para el traslado '+s.tipo.toUpperCase()+' del '+s.f.d+'/'+s.f.m+'.');
    }
    items.push(it);
  });
  items.sort(function(a,b){return (a.f?iso(a.f):0)-(b.f?iso(b.f):0)||(a.tipo==='in'?-1:b.tipo==='in'?1:0);});
  // pasajeros
  var pax=V.pax.length?V.pax:(S.paxTxt?[S.paxTxt]:[]);
  if(S.paxN&&pax.length!==S.paxN)warns.push('La solicitud dice x'+S.paxN+' pero hay '+pax.length+' nombre(s) en el PNR/solicitud.');
  if(S.paxTxt&&V.pax.length&&!V.pax.some(function(p){return norm(p)===norm(S.paxTxt);}))warns.push('El pasajero de la solicitud ("'+S.paxTxt+'") no figura en el PNR.');
  var n=S.paxN||pax.length;
  if(!items.length)warns.push('No detecté ningún servicio.');
  return {dest:dest,destNombre:dest?nombreDestino(dest):'',pais:dest?paisDe(dest):'',pax:pax,npax:n,items:items,warns:warns};
}

  var pax='<div class="pax"><span class="k">Pasajeros</span><span class="v" contenteditable>'+esc(v.pax.join('  |  '))+'</span><span class="n">'+v.npax+' pax</span></div>';
  var obs=$('obs').value.trim();
  var html='<div class="sheet '+cls+'" id="sheet">'+head+hero+intro+'<div class="body">'+pax+v.items.map(itemHtml).join('')+
    '<div class="obs" contenteditable>'+esc(obs)+'</div></div><div class="ft"><span>Hiperviajes</span><span>Voucher de servicios</span></div></div>';
  st.innerHTML=html;
  ajustarLogos();
  document.querySelectorAll('.seg button').forEach(function(b){b.classList.toggle('on',b.dataset.v===state.ver);});
}
/* ---- Integración automática de logos según la foto ---- */
function tintWhite(img,cb){
  try{var c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;var x=c.getContext('2d');x.drawImage(img,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);cb(c.toDataURL('image/png'));}catch(e){cb(null);}
}
function medirArriba(ph,hero,posY){
  var W=hero.clientWidth,H=hero.clientHeight,w=ph.naturalWidth,h=ph.naturalHeight,k=Math.max(W/w,H/h),dw=w*k,dh=h*k,ox=(W-dw)/2,oy=(H-dh)*posY;
  var rx=W*.12,ry=0,rw=W*.76,rh=H*.45;
  var sx=(rx-ox)/k,sy=(ry-oy)/k,sw=rw/k,sh=rh/k;
  var c=document.createElement('canvas');c.width=96;c.height=36;var x=c.getContext('2d');x.drawImage(ph,sx,sy,sw,sh,0,0,96,36);
  var d=x.getImageData(0,0,96,36).data,n=0,sum=0,sq=0;
  for(var i=0;i<d.length;i+=4){var L=(0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2])/255;sum+=L;sq+=L*L;n++;}
  var m=sum/n;return {m:m,sd:Math.sqrt(Math.max(0,sq/n-m*m))};
}
function ajustarLogos(){
  var sh=$('sheet');if(!sh)return;var hero=sh.querySelector('.hero'),veil=sh.querySelector('.hero .veil'),hvI=sh.querySelector('.hvlogo'),opI=sh.querySelector('.oplogo');
  if(!hero||!veil)return;
  var mode=state.logoPos,ph=hero.querySelector('img.ph'),posY=state.ver==='dig'?.4:.5;
  function setHv(f){if(hvI&&!state.hvUpload)hvI.src=f;}
  if(mode==='oscuro'){
    veil.style.background='linear-gradient(180deg,rgba(6,35,33,.74) 0%,rgba(6,35,33,.5) 45%,rgba(6,35,33,0) 92%)';
    if(state.hvUpload&&hvI)tintWhite(hvI,function(u){if(u)hvI.src=u;});else setHv('img/hiperviajes-slogan-white.png');
    if(opI){var go=function(){tintWhite(opI,function(u){if(u){opI.src=u;opI.style.background='none';}});};if(opI.complete&&opI.naturalWidth)go();else opI.addEventListener('load',go,{once:true});}
    return;
  }
  function apply(s){
    var a0=.86+.13*s,a1=.5+.45*s,a2=.12+.38*s;
    veil.style.height=(60+16*s)+'%';
    veil.style.background='linear-gradient(180deg,rgba(255,255,255,'+a0+') 0%,rgba(255,255,255,'+a1+') 45%,rgba(255,255,255,'+a2+') 78%,rgba(255,255,255,0) 100%)';
    setHv(s>.3?'img/hiperviajes-slogan-dark.png':'img/hiperviajes-slogan-teal.png');
    if(mode==='auto'&&s>.92&&!state.autoAbajo){state.autoAbajo=true;render();}
  }
  if(mode==='claro'){apply(1);return;}
  if(!ph){apply(.2);return;}
  var run=function(){try{var r=medirArriba(ph,hero,posY);apply(Math.max(0,Math.min(1,(0.82-r.m)*1.4+r.sd*2.2)));}catch(e){apply(.7);}};
  if(ph.complete&&ph.naturalWidth)run();else{ph.addEventListener('load',run,{once:true});ph.addEventListener('error',function(){apply(.7);},{once:true});}
}
function mostrarWarns(){
  var w=state.v?state.v.warns:[],ul=$('warns');
  ul.innerHTML=!state.v?'':(w.length?w.map(function(x){return '<li>⚠ '+esc(x)+'</li>';}).join(''):'<li class="ok">Todo coincide: fechas, vuelos y pasajeros.</li>');
}
function generar(){
  state.autoAbajo=false;
  var v=armarVoucher($('serv').value,$('vue').value);
  var forced=$('dest').value;
  if(forced){var f=FOTOS.filter(function(x){return x.n===forced;})[0];v.dest=f;v.destNombre=nombreDestino(f);v.pais=paisDe(f);v.warns=v.warns.filter(function(w){return w.indexOf('destino')<0;});}
  state.v=v;
  var op=OPERADORES.filter(function(o){return o.id===$('op').value;})[0];
  if(op&&!state.opUpload)state.opLogo=op.logo;
  mostrarWarns();render();
}
function cargarLogo(inp,key,upKey){
  var f=inp.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){state[key]=r.result;state[upKey]=true;render();};r.readAsDataURL(f);
}
function exportarPNG(){
  var s=$('sheet');if(!s)return;
  function go(){
    window.html2canvas(s,{scale:2,useCORS:true,backgroundColor:'#fff'}).then(function(c){
      var a=document.createElement('a');a.download='voucher-'+(state.v.destNombre||'servicios').replace(/\s+/g,'-').toLowerCase()+'-'+state.ver+'.png';a.href=c.toDataURL('image/png');a.click();
    }).catch(function(){alert('No se pudo exportar PNG (si abriste el archivo desde tu compu, probá desde la web publicada o usá Imprimir → Guardar como PDF).');});
  }
  if(window.html2canvas)return go();
  var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';sc.onload=go;sc.onerror=function(){alert('No pude cargar la librería de exportación.');};document.head.appendChild(sc);
}
function init(){
  $('op').innerHTML=OPERADORES.map(function(o){return '<option value="'+esc(o.id)+'">'+esc(o.nombre)+'</option>';}).join('')+'<option value="">(sin logo de operador)</option>';
  $('dest').innerHTML='<option value="">Detectar automáticamente</option>'+FOTOS.map(function(f){return '<option>'+esc(f.n)+'</option>';}).join('');
  $('go').onclick=generar;
  $('op').onchange=function(){state.opUpload=false;var o=OPERADORES.filter(function(x){return x.id===$('op').value;})[0];state.opLogo=o?o.logo:null;if(state.v)render();};
  $('opf').onchange=function(){cargarLogo(this,'opLogo','opUpload');};
  $('hvf').onchange=function(){cargarLogo(this,'hvLogo','hvUpload');};
  $('obs').oninput=function(){if(state.v)render();};
  document.querySelectorAll('.seg button').forEach(function(b){b.onclick=function(){state.ver=b.dataset.v;if(state.v)render();else document.querySelectorAll('.seg button').forEach(function(x){x.classList.toggle('on',x.dataset.v===state.ver);});};});
  $('lpos').onchange=function(){state.logoPos=this.value;state.autoAbajo=false;if(state.v)render();};
  $('prn').onclick=function(){window.print();};
  $('png').onclick=exportarPNG;
  if(OPERADORES[0])state.opLogo=OPERADORES[0].logo;
  render();
}
document.addEventListener('DOMContentLoaded',init);
</script></body></html>
